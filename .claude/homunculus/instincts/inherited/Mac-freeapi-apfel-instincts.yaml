# Mac Freeapi Apfel Workflow Feature Development Tdd Red Green

## Action

Follow the feature-development-tdd-red-green workflow:
1. Add failing (RED) unit/integration tests for each open ticket in test files (e.g., Tests/apfelTests/RedTDDTests.swift, Tests/integration/test_tdd_red.py).
2. Commit only the tests, ensuring no source changes (tests fail).
3. Implement the feature or bugfix in source files (e.g., Sources/Core/*.swift, Sources/CLI/*.swift, Sources/Handlers.swift, etc.).
4. Update or add corresponding tests to cover the new/changed behavior.
5. Commit the implementation and updated tests (tests now pass).
6. Merge the feature branch (often as a squash or merge commit referencing all affected files).
7. Release a new version (bump .version, update README.md, Sources/BuildInfo.swift).

## Evidence

- Workflow detected from commit patterns
- Frequency: ~1x per month
- Files: Tests/apfelTests/RedTDDTests.swift, Tests/integration/test_tdd_red.py, Sources/Core/*.swift

